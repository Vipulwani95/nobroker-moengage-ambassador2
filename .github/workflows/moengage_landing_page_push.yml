name: Moengage Landing page push

on:
  schedule:
  # # 6:02 AM IST = 12:32 AM UTC (IST is UTC+5:30) daily
    - cron: '32 0 * * *'
  workflow_dispatch:

jobs:
  push-landing-page-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run landing page push script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MOENGAGE_WORKSPACE_ID: ${{ secrets.MOENGAGE_WORKSPACE_ID }}
          MOENGAGE_API_KEY: ${{ secrets.MOENGAGE_API_KEY }}
          OUTPUT_CSV_PATH: "combined_user_states.csv"
        run: python moengage_landing_page_push.py
