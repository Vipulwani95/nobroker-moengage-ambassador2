name: Moengage previous month leads push

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (limit to 15 rows)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  sync-previous-month-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn

      - name: Map Kibana Hostname locally
        run: |
          echo "34.93.222.73 reports.nobroker.in" | sudo tee -a /etc/hosts
          cat /etc/hosts

      - name: Create VPN Configuration Files
        run: |
          echo "${{ secrets.VPN_CONFIG }}" > company.ovpn
          echo "${{ secrets.VPN_TLS_KEY }}" > "4th-UDP4-1194-vipul.wani@nobroker.in-tls.key"
          echo "${{ secrets.VPN_P12_BASE64 }}" | base64 -d > "4th-UDP4-1194-vipul.wani@nobroker.in.p12"

      - name: Connect to VPN
        run: |
          sudo openvpn --config company.ovpn --log openvpn.log --daemon
          echo "Waiting 20 seconds for VPN connection to establish..."
          sleep 20
          echo "--- OpenVPN Log Summary ---"
          sudo cat openvpn.log
          
          echo "Testing reachability of Kibana port 5609..."
          curl -I -m 10 http://reports.nobroker.in:5609/ || echo "Curl connection test complete"

      - name: Run Kibana previous month leads sync script
        env:
          MOENGAGE_WORKSPACE_ID: ${{ secrets.MOENGAGE_WORKSPACE_ID }}
          MOENGAGE_API_KEY: ${{ secrets.MOENGAGE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TEST_LIMIT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true') && '15' || '' }}
        run: python kibana_reports/kibana_previous_month_leads.py

      - name: Kill VPN Connection
        if: always()
        run: |
          sudo killall openvpn || true
