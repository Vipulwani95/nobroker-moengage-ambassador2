name: MoEngage NP6 Owners Push

on:
  schedule:
    # 5:00 PM IST = 11:30 AM UTC daily
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without actually pushing to MoEngage or writing to sheet'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  push-np6-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MoEngage NP6 Owners Push script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MOENGAGE_WORKSPACE_ID: ${{ secrets.MOENGAGE_WORKSPACE_ID }}
          MOENGAGE_API_KEY: ${{ secrets.MOENGAGE_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python moengage_np6_owners_push/moengage_np6_owners.py
